# Render Blueprint for the FastAPI ML backend.
# Render dashboard -> New -> Blueprint -> pick this repo. Secrets marked `sync: false` are asked for on first deploy.
services:
  - type: web
    name: mamacare-backend
    runtime: docker
    dockerfilePath: ./FastAPI_Backend/Dockerfile
    dockerContext: ./FastAPI_Backend
    # Fits the free 512 MB instance: the image converts the dataset into a SQLite store
    # (recipe_store.py), so the API peaks at ~420 MB instead of ~800 MB.
    # Free instances sleep after 15 min idle; the first request after that takes ~1 min.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
